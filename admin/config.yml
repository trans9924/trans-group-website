backend:
  name: github
  repo: trans9924/trans-group-website
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://trans-group.netlify.app
locale: en

publish_mode: simple

collections:
  - name: "blog"
    label: "Business Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (English)", name: "title", widget: "string" }
      - { label: "Title (বাংলা)", name: "title_bn", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Summary", name: "description", widget: "text" }
      - { label: "Article (English)", name: "body", widget: "markdown" }
      - { label: "Article (বাংলা)", name: "body_bn", widget: "markdown", required: false }
